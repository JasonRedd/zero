name: connect_and_conquer
description: "CONNECT — AI-powered help discovery and solution routing app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  flutter_contacts: ^2.3.1
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.0
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/connect_logo1.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/connect_logo.png